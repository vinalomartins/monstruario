<style>

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #121212;
    color: #eee;
}

.container {
    display: flex;
    height: 100vh;
}

/* LEFT - FICHA */
.left {
    width: 60%;
    padding: 25px;
    overflow-y: auto;
    border-right: 1px solid #2a2a2a;
    background: #181818;
}

.left h1 {
    margin: 0 0 5px;
    font-size: 28px;
}

#page {
    color: #aaa;
    margin-bottom: 15px;
}

.left img {
    display: block;
    margin: 0 auto 15px auto;

    max-width: 100%;
    border-radius: 10px;
    border: 2px solid #333;
}

.info-box {
    background: #1c1c1c;
    border: 1px solid #333;
    border-left: 4px solid #8b0000;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.info-box h2 {
    margin-top: 0;
    color: #d4af37;
    font-size: 18px;
    border-bottom: 1px solid #333;
    padding-bottom: 6px;
    margin-bottom: 10px;
}

.lore-box {
    background: #161616;
    border: 1px solid #2f2f2f;
    border-radius: 10px;
    padding: 15px;
    color: #cfcfcf;
    line-height: 1.7;
    font-style: italic;
}

.monster-meta {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.monster-meta span {
    display: inline-flex;
    align-items: center;

    padding: 6px 12px;

    background: #1a1a1a;
    border: 1px solid #2f2f2f;
    border-radius: 6px;

    font-size: 13px;
    color: #cfcfcf;

    line-height: 1;
}

/* DESCRIÇÃO BONITA */
#desc {
    white-space: pre-wrap;
    line-height: 1.6;
    background: #1f1f1f;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
}

/* RIGHT - FILTROS */
.right {
    width: 40%;
    padding: 20px;
    overflow-y: auto;
    background: #151515;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    background: #1f1f1f;
    color: white;
    border: 1px solid #333;
    border-radius: 6px;
    transition: 0.2s;
}

input:focus, select:focus {
    outline: none;
    border-color: #666;
}

/* LISTA */
.monster {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    background: #1b1b1b;
    border: 1px solid transparent;
    transition: 0.2s;
}

.monster:hover {
    background: #252525;
    border-color: #444;
}

/* NOME */
.monster strong {
    font-size: 15px;
}

/* ND BADGE */
.nd {
    float: right;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
}

/* CORES POR ND */
.nd-low { background: #2e7d32; }
.nd-mid { background: #f9a825; color: #000; }
.nd-high { background: #c62828; }
.nd-boss { background: #6a1b9a; }

/* SCROLL */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 4px;
}

.nd {
    float: right;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

/* Fácil */
.nd-low {
    background: #2e7d32;
	box-shadow: 0 0 5px #2e7d32;
}

/* Médio */
.nd-mid {
    background: #f9a825;
    color: #000;
	box-shadow: 0 0 5px #f9a825;
}

/* Difícil */
.nd-high {
    background: #c62828;
	 box-shadow: 0 0 5px #c62828;
}

/* Boss */
.nd-boss {
    background: #6a1b9a;
	box-shadow: 0 0 8px #6a1b9a;
}

.tag-filters {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 10px;

    padding: 14px;
    margin-bottom: 14px;
}

.tag-title {
    font-size: 13px;
    font-weight: bold;
    color: #d4af37;

    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.tag-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 10px;

    cursor: pointer;
    color: #ccc;

    font-size: 14px;

    transition: 0.2s;
}

.tag-checkbox:hover {
    color: #fff;
}

.tag-checkbox input[type="checkbox"] {
    width: 16px;
    height: 16px;

    accent-color: #8b0000;

    margin: 0;
}

/* 📱 MOBILE */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        width: 100%;
    }

    .left, .right {
        width: 100%;
        max-width: 100%;
        padding: 12px;
    }

    .right {
        order: 1;
        max-height: 45vh;
        overflow-y: auto;
        border-bottom: 1px solid #333;
    }

    .left {
        order: 2;
        max-height: 55vh;
        overflow-y: auto;
    }

    /* evita estouro de texto */
    #desc {
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    /* inputs 100% */
    input, select {
        width: 100%;
    }

    /* lista */
    .monster {
        width: 100%;
    }

    /* imagem */
    .left img {
        width: 100%;
        height: auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ESQUERDA -->
    <div class="left">
        <h1 id="name">Selecione um monstro</h1>
        <div class="monster-meta">
			<span id="page"></span>
			<span id="xp"></span>
		</div>      
        <div id="statsBox" class="info-box"></div>
		<div id="abilitiesBox" class="info-box"></div>
		<div id="actionsBox" class="info-box"></div>
		<div id="loreBox" class="lore-box"></div>
		<img id="image" src="" style="display:none;">
    </div>

    <!-- DIREITA -->
    <div class="right">

        <input type="text" id="search" placeholder="Buscar monstro...">

        <select id="ndFilter">
            <option value="">Todos ND</option>
        </select>

        <select id="regionFilter">
            <option value="">Todas Regiões</option>
        </select>
		
		<!-- TAGS -->
        <div class="tag-filters">

            <div class="tag-title">
                Tags da Campanha
            </div>

            <label class="tag-checkbox">
                <input type="checkbox" id="campanhaFilter">
                Campanha Principal
            </label>

            <label class="tag-checkbox">
                <input type="checkbox" id="portoFilter">
                Porto da Cicatriz
            </label>

            <label class="tag-checkbox">
                <input type="checkbox" id="customFilter">
                Custom
            </label>

            <label class="tag-checkbox">
                <input type="checkbox" id="santuarioMusgoFilter">
                Santuário do Musgo
            </label>

        </div>

        <div id="list"></div>

    </div>

</div>

<script>

// 🔥 DADOS EMBUTIDOS

const REGIOES = [

];

let monsters = [
{
    nome: "Aarakocra",
    nd: "1/4",
	xp: 50,
	imagem: "aarakocra.png",
    regiao: ["Montanha", "Plano Elemental"],
    pagina: 12,
    descricao: `Tipo: Humanoide Médio (aarakocra), neutro e bom
Classe de Armadura: 12
Pontos de Vida: 13 (3d8)
Deslocamento: 6 m, voo 15 m
XP: 50

FOR 10 (+0)
DES 14 (+2)
CON 10 (+0)
INT 11 (+0)
SAB 12 (+1)
CAR 11 (+0)

Perícias: Percepção +5
Sentidos: Percepção passiva 15
Idiomas: Aarakocra, Auran`,

    habilidades: `Ataque de Mergulho: 
Se o aarakocra estiver voando e mergulhar, pelo menos 9 metros, em linha reta em direção de um alvo e então atingi-lo com um ataque corpo-a-corpo armado, o ataque causa 3 (1d6) de dano extra ao alvo.`,

    acoes: `Garra: 
Ataque Corpo-a-Corpo com Arma: +4 para atingir, alcance 1,5 m, um alvo. Acerto: 4 (1d4 + 2) de dano cortante.

Azagaia: 
Ataque à Distância com Arma: +4 para atingir, alcance 1,5 m ou 9/36 m, um alvo. Acerto: 5 (1d6 + 2) de dano perfurante.
`,
    lore: `Aarakocras alcançam o Vórtice Uivante, uma tempestade interminável de poderosos ventos e rajadas de chuva que envolvem o tranquilo reino de Aaqa no Plano Elemental do Ar. Fazendo patronos aéreos, esses humanoides
	similares a pássaros guardam as fronteiras ventosas de seu lar contra invasores do Plano Elemental da Terra, como gárgulas, seus inimigos jurados. Inimigos do Mal Elemental. A serviço dos Duques do Vento de Aaqa, aarakocras patrulham os planos em busca de templos de Mal Elemental. Eles espiam as criaturas elementais malignas e também lutam contra essas criaturas e depois relatam aos Duques do Vento. No Plano Material, aarakocras criam ninhos nos topos das mais altas montanhas, especialmente em picos próximos de portais para o Plano Elemental do Ar. De tais alturas, aarakocras vigiam em busca de sinais de incursões elementais, assim como por ameaças que aparecerem no seu plano natal. Os aarakocras preferem viver suas vidas como o vento – aliviados e sempre em movimento – ainda que eles tenham que vigiar uma região por anos se isso for necessário para protege-la contra as incursões do Mal Elemental. Os aarakocras não possuem conceito de fronteiras políticas ou de propriedade privada e o valor de gemas, ouro e outros metais preciosos significam pouco para os aarakocras. Aos olhos deles, uma criatura deve usar o que é necessário e então jogar fora o que restar ao vento, para que outros usem. Busca pelos Sete Estilhaços. Os Duques do Vento de Aaqa vem de uma raça de seres elementais chamados vaati, que há muito governaram diversos mundos. Uma criatura chamada de Rainha do Caos surgiu e iniciou uma guerra interplanar contra o governo vaati. Para combater a ameaça, sete heróis vaati combinaram seus poderes para criar o poderoso Bastão da Lei. Em uma batalha contra o maior general da rainha, Mishka o Lobo Aranha, um vaati matou Mishka ao empurrar o bastão contra ele, como uma lança. O bastão se despedaçou em sete estilhaços que se espalharam pelo multiverso. Os aarakocras buscam sinais das localizações dos pedaços com o intuito de reconstruir o que agora é conhecido como o Bastão das Sete Partes.
	
	INVOCANDO ELEMENTAIS DO AR
	Cinco aarakocras a até 9 metros entre si, podem invocar magicamente um elemental do ar. Cada um dos cinco deve usar sua ação e movimento durante três turnos consecutivos para realizar uma dança aérea e devem manter a concentração enquanto o fazem (como se estivessem se concentrando numa magia). Quando todos os três tiverem terminado o terceiro turno de dança, o elemental aparecerá em um espaço desocupado a até 18 metros deles. Ele é amigável a eles e obedece os comando falados por eles. Ele permanece por 1 hora, até que todos os seus invocadores morram ou até que qualquer de seus invocadores dispense-o com uma ação bônus. Um invocador não pode realizar a dança novamente até ter terminado um descanso curto. Quando o elemental voltar ao Plano Elemental do Ar, qualquer aarakocra a até 1,5 metro dele pode retornar com ele.`
},

{
    nome: "Abocanhador Matraqueante",	
    nd: "2",
	xp: 450,	
    regiao: ["Subterrâneo"],
    pagina: 13,
    descricao: `Tipo: Aberração Média, neutro
Classe de Armadura: 9
Pontos de Vida: 67 (9d8 + 27)
Deslocamento: 3 m, natação 3 m

FOR 10 (+0)
DES 8 (-1)
CON 16 (+3)
INT 3 (-4)
SAB 10 (+0)
CAR 6 (-2)

Imunidade: condição caído
Sentidos: visão no escuro 18 m, Percepção passiva 10
Idiomas: —`,

habilidades: `Solo Aberrante:
O solo num raio de 3 metros do abocanhador é similar a uma massa de terreno difícil. Cada criatura que comece seu turno nessa área deve ser bem sucedida num teste de resistência de Força CD 10, ou terá seu deslocamento reduzido a 0 até o início do próximo turno dela.

Tagarelice:
O abocanhador balbucia incoerentemente quando ele vê qualquer criatura e não está incapacitado. 
Cada criatura que começar seu turno a até 6 metros do abocanhador e puder ouvilo, deve ser bem sucedida num teste de resistência de Sabedoria CD 10. 
Se falhar, a criatura não poderá realizar reações até o início do próximo turno dela e joga um d8 para determinar o que ela faz nesse turno. 
Entre 1 e 4, a criatura não faz nada. Entre 5 e 6, a criatura não realiza qualquer ação ou reação e usa seu movimento para se mover em uma direção determinada aleatoriamente.
Entre 7 e 8, a criatura realiza um ataque corpo-a-corpo contra uma criatura determinada aleatoriamente dentro do seu alcance ou não faz nada se não puder realizar tal ataque.`,

acoes:`Ataques Múltiplos. 
O abocanhador matraqueante realiza um ataque de mordida e, se puder, usa sua Cusparada Cegante.

Mordida:
Ataque Corpo-a-Corpo com Arma: +2 para atingir, alcance 1,5 m, uma criatura. Acerto: 17 (5d6) de dano perfurante.
Se o alvo for Médio ou menor, ele deve ser bem sucedido num teste de resistência de Força CD 10 ou será derrubado no chão. 
Se o alvo for morto por esse dano, ele será absorvido pelo abocanhador.

Cusparada Cegante (Recarga 5–6):
O abocanhador cospe uma bolha química num ponto que ele possa ver a até 4,5 metros dele. A bolha explode em um clarão de luz cegante no impacto. Cada criatura a até 1,5 metro do clarão deve ser bem sucedida num teste de resistência de Destreza CD 13 ou ficará cega até o final do próximo turno do abocanhador.
`,
lore:`De todos os terrores criados por magos tolos, os abocanhadores matraqueantes estão dentre os mais apavorantes e depravados. Essa criatura é a combinação de olhos, bocas e matéria liquefeita de suas vítimas anteriores. Levadas à insanidade pela destruição de seus corpos e absorção pelo abocanhador, essas vítimas balbuciam loucuras incoerentes, forçadas a consumir tudo ao alcance. Forma Ameboide. O corpo do abocanhador matraqueante é uma forma amorfa de bocas e olhos que se impulsionam deslizando para a frente, fixando diversas bocas ao solo e puxando as massa adiante. Apesar de se mover lentamente, ele pode nadar na água, lema e areia movediça facilmente. Bocas da Loucura. Quando um abocanhador matraqueante sente sua presa, suas bocas começam a murmurar e tagarelar, cada uma com uma voz diferente: grave ou aguda, gemendo ou ululando, gritando em agonia ou êxtase. Essa tagarelice cacofônica sobrepõe os sentidos de qualquer criatura que ouvir, fazendo a maioria fugir aterrorizada. Outros são dominados pela loucura ou permanecem paralisados, fixados na horrenda criatura enquanto ela desliza adiante para consumi-los. Consome Tudo. Impelido a devorar qualquer criatura ao alcance, um abocanhador matraqueante escoa sobre suas vítimas paralisadas pelo seu discurso louco, as inúmeras vozes silenciam temporariamente, enquanto ele morte e engole carne viva. O monstro liquefaz rocha quando em contato, dificultando a fuga de criaturas que superem sua tagarelice. Um abocanhador matraqueante não deixa nada de sua presa para trás. No entanto, mesmo quando o último pedaço do corpo da vítima é consumido, seus olhos e boca emergem a superfície, prontos para se juntar ao cântico de tormento matraqueante que dá as boas-vindas à próxima refeição do monstro.`
},

{
    nome: "Abolete",
    nd: "10",
	xp: 5900,	
    regiao: ["Subaquático", "Subterrâneo"],
    pagina: 14,
    descricao: `Aberração Grande, leal e mau
Classe de Armadura 17 (armadura natural)
Pontos de Vida 135 (18d10 + 36)
Deslocamento 3 m, natação 12 m

FOR 21 (+5)
DES 9 (-1)
CON 15 (+2)
INT 18 (+4)
SAB 15 (+2)
CAR 18 (+4)

Testes de Resistência Con +6, Int +8, Sab +6
Perícias História +12, Percepção +10
Sentidos visão no escuro 36 m, Percepção passiva 20
Idiomas Dialeto Subterrâneo, telepatia 36 m`,

habilidades:`Anfíbio:
O abolete pode respirar ar e água.

Nuvem Mucosa:
Quando estiver submerso, o abolete fica envolto por um muco transformador. Uma criatura que toque o abolete  u que atinja ele com um ataque corpo-a-corpo estando a até 1,5 metro dele deve ser bem sucedida num teste de resistência de Constituição CD 14. Se fracassar, a criatura fica adoecida por 1d4 horas. A criatura adoecida só pode respirar sob a água.

Sondagem Telepática:
Se uma criatura se comunicar telepaticamente com o abolete, o abolete descobre os maiores desejos da criatura se o abolete puder vê-la.`,

acoes:`Ataques Múltiplos:
O abolete realiza três ataques de tentáculos.

Cauda:
Ataque Corpo-a-Corpo com Arma: +􀏵 para atingir, alcance 3 m, um alvo. Acerto: 15 (3d6 + 5) de dano de concussão.

Escravizar (3/Dia):
O abolete afeta uma criatura que ele possa ver a até 9 metros dele. O alvo deve ser bem sucedido num teste de resistência de Sabedoria CD 14, ou ficará magicamente enfeitiçado pelo abolete até que ele morra ou esteja em um plano de existência diferente do alvo. O alvo enfeitiçado está sob o controle do abolete e não pode realizar reações e, o abolete e o alvo, podem se comunicar telepaticamente um com o outro a qualquer distância.
Sempre que o alvo enfeitiçado sofrer dano, ele pode repetir o teste de resistência. Se for bem sucedido, o efeito termina.
Não mais de uma vez a cada 24 horas, o alvo também pode repetir o teste de resistência quando ele estiver a pelo menos 1,5 quilômetro de distância do abolete.

Tentáculo: Ataque Corpo-a-Corpo com Arma: +9 para atingir, alcance 3 m, um alvo. Acerto: 12 (2d6 + 5) de dano de concussão. Se o alvo for uma criatura, ele deve ser bem sucedido num teste de resistência de Constituição CD 14 ou ficará adoecido. A doença não causa nenhum efeito por 1 minuto e pode ser removida por qualquer magia que cure doenças. Após 1 minuto, a pele da criatura adoecida se torna translucida e viscosa, a criatura não pode recuperar pontos de vida a não ser que esteja submersa e a doença só pode ser removida por cura completa ou por outra mágica de curar doenças de 6° nível ou superior. Quando a criatura estiver fora de um corpo de água, ela sofre 6 (1d12) de dano de ácido a cada 10 minutos, a menos que a pele dela seja umedecida antes de 10 minutos se passarem.

Ações Lendárias:
O abolete pode realizar 3 ações lendárias, escolhidas dentre as opções abaixo. Apenas uma ação lendária pode ser usada por vez e apenas no final do turno de outra criatura. O abolete recupera as ações lendárias gastas no começo do turno dele.
Chicotear com a Cauda: 
O abolete realiza um ataque de cauda.

Detectar: 
O abolete realiza um teste de Sabedoria (Percepção).

Dreno Psíquico (Custa 2 Ações): Uma criatura enfeitiçada pelo abolete sofre 10 (3d6) de dano psíquico e o abolete recupera uma quantidade de pontos de vida igual ao dano sofrido pela criatura.
`,
lore:`Antes da chegada dos deuses, os aboletes espreitavam nos oceanos primordiais e em lagos subterrâneos. Eles chegaram com suas mentes e tomaram controle das formas de vida florescentes do reino mortal, fazendo dessas criaturas seus escravos. Sua dominação os torna similares a deuses. Então, os verdadeiros deuses apareceram, esmagando o império abolete e libertando seus escravos. Os aboletes nunca esqueceram. Memórias Eternas. Os aboletes possuem memórias impecáveis. Eles passam seus conhecimentos e experiências de geração em geração. Então, a injuria da derrota deles pelos deuses permanece perfeitamente preservada em suas mentes. A mente dos aboletes são preciosos conhecimentos antigos, relembrando de momentos da pré-história com perfeita clareza. Eles tramaram pacientemente e intrincadamente através das eras. Poucas criaturas podem conceber a extensão dos planos de um abolete. Deuses no Lago. Os aboletes habitam ambientes aquáticos, incluindo abismos oceânicos, lagos profundos e o Plano Elemental da Água. Nesses domínios e nas terras adjacentes, os aboletes são como deuses, demandando veneração e obediência dos seus subordinados. Quando eles consomem outras criaturas, os aboletes adicionam o conhecimento e as experiências de suas prezas às suas memórias eternas. Os aboletes usam seus poderes telepáticos para ler a mente de criaturas e descobrir seus desejos. Um abolete usa esse conhecimento para ganhar a lealdade da criatura, prometendo satisfazer tais necessidades em troca de obediência. Dentro do seu covil, o abolete pode, posteriormente, usar seus poderes para enganar os sentidos, fornecendo às criaturas, como seus seguidores, a ilusão das recompensas prometidas. Inimigos dos Deuses. A queda do poder dos aboletes está escrita com total claramente em suas memórias impecáveis, pois os aboletes nunca morrem de verdade. Se o corpo de um abolete for destruído, seu espírito retorna para o Plano Elemental da Água, onde um novo corpo se funde a ele ao longo de dias ou meses. Em última análise, os aboletes sonham em destituir os deuses e recuperar o controle sobre o mundo. Os aboletes tiveram incalculáveis eras para tramar e preparar seus planos para uma perfeita execução.

O COVIL DO ABOLETE
O covil de um abolete em lagos subterrâneos ou nas profundezas rochosas do oceano, frequentemente é cercado pelas ruínas de uma antiga cidade abolete caída. Um abolete passa a maior parte de sua existência submerso, emergindo ocasionalmente para lidar com visitantes ou adoradores dementes.

AÇÕES DE COVIL
Quando estiver lutando dentro de seu covil, um abolete pode invocar a magia ambiente para realizar ações de covil. No valor de iniciativa 20 (quebrando toda a sequência de iniciativa), o abolete realiza uma ação de covil fazendo um dos efeitos a seguir: 􀁸 O abolete conjura força fantasmagórica (nenhum componente é necessário) em qualquer quantidade de criaturas que ele possa ver, a até 18 metros dele. Enquanto mantiver a concentração nesse efeito, o abolete não pode realizar outras ações de covil. Se um alvo for bem sucedido no teste de resistência ou se o efeito terminar para ele, o alvo ficará imune a ação de covil força fantasmagórica do abolete pelas próximas 24 horas, apesar de tal criatura poder escolher ser afetada.
- Poças de água a até 27 metros do abolete formam marés agarradoras. Qualquer criatura no solo a até 6 metros de tais poças deve ser bem sucedida num teste de resistência de Força CD 14, ou será puxada 6 metros para dentro da água e ficará caída. O abolete não pode usar essa ação de covil novamente até ter usado uma ação diferente.
- A água no covil do abolete magicamente se transforma um condutor para a ira da criatura. O abolete pode afetar qualquer número de criaturas dentro da água que ele possa ver a até 27 metros dele. Um alvo deve ser bem sucedido num teste de resistência de Sabedoria CD 14 ou sofrerá 7 (2d6) de dano psíquico. O abolete não pode usar essa ação de covil novamente até ter usado uma ação diferente.

EFEITOS REGIONAIS
A região contendo o covil de um abolete é deformada pela presença da criatura, o que cria um ou mais dos seguintes efeitos:
- Superfícies subterrâneas a até 1,5 quilômetro do covil de um abolete fica viscosa e úmida se torna terreno difícil.
- Fontes de água a até 1,5 quilômetro do covil ficam sobrenaturalmente poluídas. Os inimigos do abolete que beberem dessa água vomitarão dentro de minutos.
- Com uma ação, o abolete pode criar uma imagem ilusória de si mesmo a até 1,5 quilômetro do seu covil. A cópia pode aparecer em qualquer lugar que o abolete já tenha visto anteriormente ou em qualquer lugar que uma criatura enfeitiçada pelo abolete possa ver atualmente. Uma vez criada, a imagem dura enquanto o abolete mantiver a concentração, como se ele estivesse se concentrando em uma magia. Apesar da imagem ser intangível, ela se parece, emite sons e se move como o abolete. O abolete pode sentir, falar e usar telepatia da posição da imagem como se estivesse presente nessa posição. Se a imagem sofrer qualquer dano, ela desaparece. Se o abolete morrer, os primeiros dois efeitos desvanecem dentro de 3d10 dias.`

lore:`Um ankheg lembra um enorme inseto cheio de pernas, suas longas antenas convulsionam em resposta a qualquer movimento a sua volta. Suas pernas terminam em ganchos afiados adaptados para esburacar e destroçar suas presas e suas poderosas mandíbulas podem cortar uma árvore pequena ao meio.

lore:`Uma anomalia da água é um guardião elemental vinculado a um local cheio de água especifico, como uma piscina ou fonte. Invisível enquanto está imerso na água, seu corpo serpentino torna-se claro apenas quando ele emerge para atacar, usando suas espirais para esmagar qualquer criatura diferente do seu invocador e aqueles que o invocador declarar fora dos limites. Quando é morta, uma anomalia da água torna-se uma poça inanimada de água.

acoes:`Drenar Vida: 
Ataque Corpo-a-Corpo com Magia: +6 para atingir, alcance 1,5 m, uma criatura. Acerto: 21 (4d8 + 3) de dano necrótico. O alvo deve ser bem sucedido num teste de resistência de Constituição CD 14 ou seu máximo de pontos de vida será reduzido em um valor igual ao dano sofrido. Essa redução dura até o alvo terminar um descanso longo. O alvo morre se esse efeito reduzir seu máximo de pontos de vida a 0. 

Criar Espectro:
A aparição afeta um humanoide a até 3 metros dela, que esteja morto a não mais de 1 minuto e tenha morrido violentamente. O espírito do alvo se ergue como um espectro no espaço do seu corpo ou no espaço desocupado mais próximo. O espectro está sob o controle da aparição. A aparição não pode ter mais de sete espectros sob seu controle ao mesmo tempo.`,

lore:`Uma aparição é a encarnação da malícia, concentrada em uma forma incorpórea que busca extinguir toda a vida. A criatura é impregnada de energia negativa e sua mera passagem pelo mundo deixa as plantas próximas negras e murchas. Animais fogem ante sua presença. Até mesmo pequenas chamas se extinguem pela sucção de esquecimento da horrenda existência da aparição. 
Esquecimento Vil. Quando um humanoide mortal vive uma vida aviltada ou realiza um pacto diabólico, ele condena sua alma a danação eterna nos Planos Inferiores. No entanto, as vezes a alma se torna tão impregnada de energia negativa que ela sucumbi a si mesma e deixa de existir um instante antes de embarcar numa terrível vida após a morte. Quando isso ocorre, o espírito se torna uma aparição desalmada – um vácuo maléfico preso no plano onde ele morreu. Praticamente nada da vida anterior da aparição é preservado; em sua nova forma, ela existe apenas para aniquilar outras vidas.
Desprovido de Corpo. Uma aparição pode se mover através de criaturas e objetos sólidos tão facilmente quando uma criatura mortal se move na neblina. 
Uma aparição pode manter algumas poucas memórias de sua vida mortal como ecos sombrios. No entanto, até mesmo os eventos e emoções mais marcantes tornam-se nada além de vagas impressões, tão efêmeros quanto a fraca lembrança deum sonho. Uma aparição pode parar para observar algo que a fascinava em vida, ou ela pode reduzir a sua ira ao reconhecer uma amizade passada. Tais momentos ocorrem raramente, no entanto, já que a maioria das aparições desprezam o que elas foram como um lembrete do que elas se tornaram.
Comandantes Mortos-Vivos. Uma aparição pode criar um servo morto-vivo de um espírito de uma criatura humanoide que tenha sofrido recentemente uma morte violenta. Esse fragmento de aflição se torna um espectro, rancoroso de tudoque vive.
As aparições, às vezes, comandam as legiões de mortos, conspirando para a danação das criaturas vivas. Quando elas emergem de suas tumbas para a batalha, vida e esperança murcham perante ela. Mesmo que oexército de uma aparição seja forçado a recuar, as terras ocupadas por suas forças ficam tão devastadas e estéreis que os que vivem nelas geralmente ficam famintos e morrem.
Natureza Morta-Viva. Uma aparição não precisa respirar, comer, beber ou dormir.`

acoes:`Ataques Múltiplos:
O arbusto errante realiza dois ataques de pancada. Se ambos os ataques atingirem um alvo Médio ou menor, o alvo estará agarrado (CD 14 para escapar) e o arbusto errante usa seu Engolfar nele.

Pancada: Ataque Corpo-a-Corpo com Arma: +7 para atingir, alcance 1,5 m, um alvo. Acerto: 13 (2d8 + 4) de dano de concussão.

Engolfar: O arbusto errante engolfa uma criatura Média ou menor que ele tenha agarrado. A criatura engolfada está cega, impedida e incapaz de respirar e deve ser bem sucedida num teste de resistência de Constituição CD 14 no início de cada turno do errante ou sofrerá 13 (2d8 + 4) de dano de concussão. Se o errante se mover a criatura engolfada se move com ele. O errante pode ter apenas uma criatura engolfada por vez.`,

lore:`Um arbusto errante, às vezes chamado apenas de errante, vagam lentamente por pântanos desolados, charcos lúgubres e florestas tropicais, consumindo qualquer matéria orgânica em seu caminho. Este amontoado podre de vegetação animada tem aproximadamente a altura de um humano e meio, terminando em uma “cabeça” sem rosto no topo.
Devoradores que Consomem Tudo: Um arbusto errante se alimenta de qualquer material orgânico, consumindo incansavelmente plantas enquanto se move e devorando animais que não conseguem escapar dele. Apenas a raridade e lentidão do arbusto errante previne que ele destrua um ecossistema inteiro. Mesmo assim, a presença deles incomoda o ambiente natural das plantas e vida animal e uma calma inquietante permeia os pântanos e florestas assombrados por esses horrores insaciáveis.
Caçadores Ocultos: Compostos de folhas, vinhas, raízes e outros compostos naturais apodrecidos de pântanos e florestas, errantes podem se misturar ao seus ambientes. Já que eles se movem lentamente, eles raramente tentam perseguir e pegar presas. Ao invés disso, eles permanecem parados, sustentando-se absorvendo nutrientes das suas redondezas enquanto esperam as presas virem até eles. Quando uma criatura passa próximo ou pousa sobre um arbusto errante, o monstro ganha vida, agarrando e absorvendo a presa desavisada.
Gerados por Relâmpagos: Um arbusto errante é resultado de um fenômeno em que relâmpagos ou magia feérica revigora o que outrora foi uma planta pantanosa comum. À medida que a planta renasce para sua segunda vida, ela sufoca a vida de planas e animais a sua volta, cobrindo seus corpos numa pilha ao redor de suas raízes. Essas raízes, eventualmente, se desprendem do solo, direcionando o amontoado trôpego em busca de novas fontes de alimento. 
A Erva que Anda: O instinto que guia o arbusto errante é um pedúnculo de raiz central, entocada em algum lugar dentro da forma maciça. Os restos do errante consistem em um amontoado apodrecido que, ao mesmo tempo, ele acumula e alimenta, o qual protege o pedúnculo de raiz que o anima para esmagar e sufocar a vida de qualquer criatura.
A densa massa do corpo do arbusto errante encolhe-se sob o efeito de frio e fogo. A eletricidade revigora o pedúnculo de raiz, fortalecendo o arbusto errante e potencializando seu ímpeto consumidor.
Independentemente de sua forma monstruosa, o arbusto errante é uma planta viva que necessita de ar e suprimentos. Apesar de ela não dormir como os animais fazem, ela pode ficar adormecida por dias antes de se erguer para caçar comida.
A Ameaça que Ressurge: Se um arbusto errante enfrentar a derrota perante um oponente avassalador, o pedúnculo de raiz pode fingir-se de morto, desmoronando os restos do errante. Se não for morto subsequentemente, o pedúnculo de raiz reativa os restos do errante, lentamente recompondo seu corpo inteiro, então, mais uma vez, se ergue para consumir tudo o que puder. Desta maneira, as infestações do arbusto errante que se pensava terem sido destruídos a muito, podem ocorrer novamente e novamente.`

lore:`Nativos do Plano Elemental do Fogo, os azers são mestres da forja, mineiros peritos e inimigos jurados dos efreet. Em relação à aparência e maneiras, um azer
assemelhasse a um anão, mas só na fachada. Sob sua pele de aparência metálica, um azer é um ser de fogo, que por fora se manifesta em seu cabelo e barba flamejantes. Construídos, Não Nascidos. Os azers não se reproduzem. Cada um deles é construído de bronze por outro azer e imbuído com uma porção da chama interior do construtor. Cada azer é esculpido com características únicas. Esse processo de construção limita o crescimento populacional dos azers e é a razão principal para essas criaturas continuarem raras.
Habitantes Vulcânicos: Os azers habitam em reinos nas fronteiras entre o Plano Elemental da Terra e o Plano Elemental do Fogo – uma cadeia de montanha e vulcões cujos cumes erguem-se como sequencias de fortalezas. Sob os picos das montanhas, abaixo de caldeiras vulcânicas e entre rios de magma, os azers extraem metal incandescente e gemas brilhantes da terra. Esquadrões de azers patrulham as passagens e túneis para seu reino rechaçando as investidas de salamandras cujos mestres efreet ordenam ataques contra os reinos azer.
Inimigos dos Efreet: Há muito tempo, os efreet e os azers eram aliados. Os azers ajudaram a criar a Cidade de Bronze, forjando aquele lar dos efreet em um dos lugares mais maravilhosos já criados. Quando os azers terminaram o trabalho deles, os efreet os traíram, realizando uma tentativa falha de escravizar os azers e de proteger os segredos da cidade. Apesar das incursões ocasionais e conflitos, no entanto, os dois lados abstiveram-se, até agora, de um conflito direto. Os azers acreditam que apenas a ameaça de serem reveladas as passagens escondidas para a Cidade de Bronze mantem os efreet em xeque.
Mestres do Metal e das Gemas. Os azers são artesãos memoráveis e criam trabalhos maravilhosos com as gemas e metais preciosos encontrados no habitat vulcânico. Eles avaliam o valor de tais tesouros acima de todas as outras coisas, por vezes, enviando grupos para os planos em busca de metais e gemas raros.
Quando os azers são evocados através de magia para o Plano Material, em geral é para ajudar a forjar um elaborado item mágico ou obra de arte, pois dizem que sua perícia com tal ofício é incomparável. Fogo Vivo. Um azer não precisa comer, beber ou dormir.`

lore:`Quando a noite cai, viajantes desafortunados ouvem um choros baixos da morta desamparada. Esse espírito lamentável é uma banshee, uma criatura rancorosa formada a partir do espírito de uma elfa. 
As banshees parecem esquálidas formas luminosas que lembram vagamente suas características mortais. O rosto de uma banshee está envolto em um emaranhado de cabelos, o corpo vestido com trapos esfarrapados que vibram à medidaque ela se move.
Ira Divina: As banshees são os mortos-vivos remanescentes de elfas que, abençoadas com grande beleza, fracassaram em usar sua dádiva para trazer alegria ao mundo. Ao invés disso, elas usaram sua beleza para corromper e controlar os outros. As elfas afetadas pela maldição da banshee não experimentam qualquer alegria, sentindo apenas angústia na presença dos vivos. À medida que a maldição cobra seu preço, suas mentes e corpos decaem, até que a morte complete suas transformações em monstros mortos-vivos.
Limite do Sofrimento: Uma banshee torna-se eternamente limitada ao lugar de seu falecimento, incapaz de se aventurar a mais de sete quilômetros e meio desse lugar. Ela é forçada a reviver cada momento de sua vida com perfeita memória, ainda assim se recusa a aceitar a responsabilidade por sua ruína.
Cobiçadoras da Beleza: A vaidade que inspirou a criação da maldição da banshee persiste na morte-vida. Essas criaturas cobiçam belos objetos: joias finas, pinturas, estátuas e outros objetos de arte. Ao mesmo tempo, uma banshee abomina qualquer superfície espelhada, pois não consegue suportar ver o horror de sua própria existência. Um único vislumbre de si mesma é suficiente para levar a banshee à fúria.
Natureza Morta-Viva. Uma banshee não precisa respirar, comer, beber ou dormir`

habilidades:`Olhar Petrificante:

Uma criatura que não esteja surpresa pode desviar seu olhar para evitar o teste de resistência no início do turno dela. Se ela o fizer, ela não poderá ver o basilisco até o início do próximo turno dela, quando ela poderá desviar seu olhar novamente. Se olhar para o basilisco nesse meio tempo, ela deve imediatamente realizar a resistência.

acoes:`Mordida:

lore:`Viajantes, às vezes encontram objetos que se parecem com pedaços de esculturas de pedra extremamente realistas de animais selvagens. As partes que faltam parecem ter sido arrancadas a dentada. Exploradores experientes reconhecem esses restos como avisos, sabendo que o basilisco que as criou possivelmente esteja próximo. 
Predadores Adaptáveis: Os basiliscos sobrevivem em climas áridos, temperados ou tropicais. Eles repousam em cavernas ou em outros locais abrigados. Na maioria das vezes, os basiliscos são encontrados no subterrâneo. Um basilisco que nascer e crescer em cativeiro pode ser domesticado e treinado. Um basilisco treinado sabe como evitar o encontro dos seus olhos com os do seu mestre para protege-lo do seu olhar, mas isso faz dele uma besta guardiã assustadora. Devido a esse uso, os ovos de basilisco são extremamente valorizados.
Olhar Pétreo: Os basiliscos são lentos para caçar criaturas, mas eles não precisam perseguir presas. Fitar o olhar sobrenatural de um basilisco pode ser o suficiente para ser afetado por uma rápida transformação, transformando a vítima em pedra porosa. Os basiliscos, com suas poderosas mandíbulas, são capazes de consumir a pedra. A pedra volta a forma orgânica no esôfago do basilisco.
Alguns alquimistas dizem saber como processar o esôfago do basilisco e os fluidos contidos dentro dele. Manuseado corretamente, o esôfago produz um óleo que pode retornar criaturas petrificadas em carne e à vida. Infelizmente,  para tais vítimas, quaisquer partes perdidas na forma de pedra continua faltando se a criatura for revivida. A revivificação usando o óleo é impossível se uma parte vital da criatura petrificada, como sua cabeça, estiver faltando.`
},

acoes:`Ataques Múltiplos:
O behir realiza dois ataques: um com sua mordida e um de constrição.

Mordida:
Ataque Corpo-a-Corpo com Arma: +10 para atingir, alcance 3 m, um alvo. Acerto: 22 (3d10 + 6) de dano perfurante.

Constrição:
Ataque Corpo-a-Corpo com Arma: +10 para atingir, alcance 1,5 m, uma criatura Grande ou menor. Acerto: 17 (2d10 + 6) de dano de concussão mais 17 (2d10 + 6) de dano cortante. O alvo fica agarrado (CD 16 para escapar) se o behir ainda não estiver constringindo uma criatura e o alvo é impedido até o agarrão terminar.

Sopro Elétrico (Recarrega 5–6):
O behir expele uma linha de eletricidade de 6 metros de comprimento por 1,5 metro de largura. Cada criatura na linha deve realizar um teste de resistência de Destreza CD 16, sofrendo 66 (12d10) de dano elétrico se falhar na resistência ou metade desse dano se obtiver sucesso.

Engolir:
O behir realiza um ataque de mordida contra um alvo Médio ou menor que esteja agarrando. Se o ataque atingir, o alvo também será engolido e o agarrão termina. Enquanto estiver engolido, o alvo estará cego e impedido, ele terá cobertura total contra ataques e outros efeitos de fora do behir e sofre 21 (6d6) de dano ácido no começo de cada turno do behir. Um behir pode ter apenas uma criatura engolida por vez.
Se o behir sofrer 30 de dano ou mais em um único turno por uma criatura engolida, o behir deve ser bem sucedido num teste de resistência de Constituição CD 14 no final desse turno ou regurgitará a criatura, que cairá em um espaço a até 3 metros do behir. Se o behir morrer, uma criatura engolida não estará mais impedida por ele e poderá escapar do corpo usando 4,5 metro de movimento, estando caída ao sair.`,

lore: `O sinuoso behir rasteja pelo solo e escala pelas paredes para alcançar suas presas. Seu sopro elétrico pode incinerar a maioria das criaturas, até mesmo oponentes mais poderosos são constringidos em seu corpo enrolado e devorados vivos.
A forma monstruosa do behir lembra uma combinação de uma centopeia com um crocodilo. Sua pele escamada vai da coloração ultramarina até azul escuro, esmaecendo para o azul claro em sua parte inferior. 
Predadores de Caverna: Os behirs repousam em lugares inacessíveis para outras criaturas, preferindo locais onde intrusos precisem realizar uma escalada lancinante para alcança-los. Abismos profundos, cavernas elevadas em paredes de penhascos e cavernas alcançadas apenas se espremendo, túneis sinuosos são locais privilegiados para o behir efetuar uma emboscada. As dozes patas do behir permitem que ele perambule pelo seu covil com facilidade. Quando não está escalando, ele se move ainda mais rápido dobrando suas pernas para fora de seu corpo e deslizando como uma cobra.
Os behirs engolem suas presas inteiras, depois disso eles entram num período de hibernação enquanto as digerem. Enquanto estiver hibernando, um behir escolhe um local escondido onde os intrusos no seu covil possam não percebe-lo.
Adversários dos Dragões: Numa época a muito esquecida, gigantes e dragões se engajaram numa guerra aparentemente interminável. Gigantes da tempestade criaram os primeiros behirs como armas contra os dragões e os behirs guardaram um ódio natural pelos seres dracônicos.
Um behir nunca faz seu covil numa área que ele saiba ser habitada por um dragão. Se um dragão tentar estabelecer seu covil dentro de algumas dezenas de quilômetros do covil de um behir, o behir é compelido a matar o dragão ou a afugenta-lo. Apenas se o dragão se mostrar muito poderoso para se enfrentar, um behir irá desistir, buscando um novo local para seu covil o mais longe possível.`},

	habilidade: `CONVENÇÃO DE BRUXAS
Quando as bruxas tem que trabalhar juntas, elas formam convenções, apesar da natureza egoísta delas. Uma convenção é feita por bruxas de quaisquer tipos, todas sendo consideradas iguais dentro do grupo. No entanto, cada uma das bruxas continua a desejar mais poder pessoal.
Uma convenção consiste em três bruxas, portanto, qualquer discussão entre duas bruxas pode ser decidida pela terceira. Se mais de três bruxas se juntarem, como poderia acontecer se duas convenções entrassem em conflito, o resultado geralmente é o caos.
Conjuração Partilhada. Enquanto todos os três membros da convenção de bruxas estiverem a até 9 metros um do outro, eles podem conjurar as seguintes magias da lista de magias de mago, mas devem partilhar o espaço de magia entre eles:

Inteligência da bruxa: Olho de Bruxa. Uma convenção de bruxas pode construir um item mágico chamado olho de bruxa, que é feito a partir de um olho de verdade envernizado e, muitas vezes, preso a um pingente ou outro item que se possa vestir. O olho de bruxa geralmente é confiado a um lacaio para que ele guarde e transporte. Uma bruxa em uma convenção pode realizar uma ação para ver o que o olho de bruxa vê se ambos estiverem no mesmo plano de existência. Um olho de bruxa tem CA 10, 1 ponto de vida e visão no escuro com alcance de 18 metros de raio. Se for destruído, cada membro da convenção sofre 3d10 de danopsíquico e fica cego por 24 horas.

    lore: `As bruxas representam tudo que é mal e cruel. Apesar de elas se parecem com velhas enrugadas, não existe nada mortal sobre essas criaturas monstruosas, cujas formas refletem apenas a perversidade em seus corações.
	Faces da Maldade: Seres ancestrais com origens em Faéria, as bruxas são úlceras no mundo mortal. Seus rostos enrugados são emoldurados por longos cabelos desgrenhados, pústulas e verrugas horrendas pontilham sua pele manchada e seus longos e finos dedos terminam em garras que podem cortar a carne ao toque. Suas vestes simples estão sempre esfarrapadas e sujas.
	Todas as bruxas possuem poderes mágicos e algumas tem afinidade com conjuração. Elas podem alterar suas formas ou amaldiçoar seus inimigos e sua arrogância as inspira a ver sua magia como uma provocação à magia dos deuses, blasfemando em todas as oportunidades. As bruxas se intitulam de formas obscuramente excêntricas, reivindicando alcunhas como Morwen Negra, Peggy Pé de Porco, Vovó Titchwillow, Nana Shug, Ethel Podre ou Auntie Dente de Verme. 
	Maternidade Monstruosa: As bruxas se propagam ao raptar e devorar infantes humanos. Após usurpar um bebê do seu berço ou do ventre da mãe a bruxa devora a pobre criança. Uma semana depois, a bruxa dá a luz a uma filha que se parece humana até seu décimo terceiro aniversário, que é quando a criança se transforma em uma imagem cuspida de sua mãe bruxa. As bruxas, às vezes criam as filhas que elas geram, criando convenções. Uma bruxa também pode retornar a criança para seus pais de luto, apenas para ver das sombras a criança crescer até se tornar um horror. Barganhas Obscuras. Arrogantes ao extremo, bruxas acreditam serem as mais espertas das criaturas e elas tratam todos os outros como inferiores. Mesmo assim, uma bruxa está aberta a negociar com mortais contanto que esses mortais mostrem o devido respeito e deferência. Ao longo de suas longas vidas, as bruxas acumulam muito conhecimento da sabedoria local, das criaturas sombrias e da magia que elas tem o prazer de negociar.
	As bruxas gostam de assistir os mortais trazerem suas próprias ruínas e barganhar com uma bruxa é sempre perigoso. Os termos de tais barganhas geralmente envolvem demandas para comprometer princípios ou desistir de algo estimado – especialmente se a coisa perdida diminuir ou invalidar algum conhecimento adquirido através da barganha. 
	Uma Natureza Imunda: As bruxas adoram o macabro e enfeitam seus trajes com coisas mortas e acentuam sua aparência com ossos, pedaços de carne e imundícies. Elas ostentam manchas e criam feridas para produzir pranto e carne supurada. Criaturas atraentes causam nojo em uma bruxa, o que pode “ajudar” tais criaturas ao desfigura-las e transforma-las. Esse abraço perturbador e desagradável estende-se a todos os aspectos da vida de uma bruxa. Uma bruxa poderia voar em uma caveira mágica gigante, pousando em uma árvore moldada para se parecer com um enorme corpo sem cabeça. Outra pode viajar com uma coletânea de monstros e escravos mantidos enjaulados e disfarçados através de ilusão para enganar criaturas desatentas que se aproximem. As bruxas afiam seus dentes em mós e torcem tecidos intestinais de suas vítimas, reagindo com satisfação ao horror provocado por suas ações.
	Irmandade Obscura: As bruxas mantem contato umas com as outras e partilham conhecimento. Através de tais contatos, é como se cada bruxa soubesse de cada outra bruxa que exista. As bruxas não se gostam, mas elas respeitam um código de conduta eterno. As bruxas anunciam sua presença antes de cruzarem o território de outra bruxa, trazendo presentes quando adentram na residência de outra bruxa e não quebram promessas dados por outras bruxas – contanto que a promessa não tenha sido feita com os dedos cruzados. Alguns humanoides cometem o erro de pensar que os códigos de conduta das bruxas se aplicam a todas as criaturas. Quando confronta tais indivíduos, um bruxa pode achar divertido enrolar o tolo por um tempo antes de ensiná-lo uma lição permanente. 
	Covis Sombrios: As bruxas habitam em florestas escuras e retorcidas, charnecas desoladas, costas litorâneas tempestuosas e pântanos sombrios. Com o tempo, a paisagem ao redor do covil de uma bruxa começa a refletir a ansiedade da criatura de tal forma que a própria terra pode atacar e matar invasores. Árvores retorcidas pelas trevas atacam transeuntes, enquanto que vinhas serpenteiam por debaixo da terra para enrolar e puxas as criaturas, uma por vez. Nevoeiros fedorentos de poluição tornam o ar venenoso e ocultam poças de areia movediça e sumidouros que consomem os andarilhos desatentos.`

acoes:`Garras (Forma de Bruxa Apenas):
 Ataque Corpo-a-Corpo com Arma: +7 para atingir, alcance 1,5 m, um alvo. Acerto: 13 (2d8 + 4) de dano cortante.
 
Mudar Forma:
A bruxa magicamente se metamorfoseia em uma fêmea humanoide Pequena ou Média ou de volta para sua forma verdadeira. As estatísticas de jogo dela são as mesmas em cada forma. Qualquer equipamento que ela esteja usando ou carregando é transformado. Ela volta a sua forma verdadeira se morrer.

Forma Etérea:
A bruxa magicamente entra no Plano Etéreo do Plano Material ou vice-versa. Para fazê-lo, a bruxa deve ter uma pedra-coração consigo. 

Pesadelo Assombrado (1/Dia): Quando estiver no Plano Etéreo, a bruxa toca magicamente um humanoide dormindo no Plano Material. Uma magia proteção contra o bem e mal conjurada no alvo previne esse contato, assim como um círculo mágico. Enquanto o contato durar, o alvo terá terríveis visões. Se essas visões durarem por pelo menos 1 hora, o alvo não recebe qualquer benefício pelo descanso e seu máximo de pontos de vida é reduzido em 5 (1d10). Se esse efeito reduzir o máximo de pontos de vida do alvo a 0, o alvo morre e, se o alvo for mau, sua alma é aprisionada na sacola de almas da bruxa. A redução no máximo de pontos de vida do alvo dura até ser removida pela magia restauração maior ou uma magia similar`,

lore:`ITENS DA BRUXA DA NOITE
Uma bruxa da noite carrega dois itens mágicos muito raros que ela mesma deve construir. Se quaisquer desses objetos for perdido, a bruxa da noite não medirá esforços para recuperá-lo, já que a criação de um novo demanda tempo e esforço. 

Pedra-Coração: Essa gema negra e lustrosa permite que uma bruxa da noite torne-se etérea enquanto a possuir. O toque da pedra-coração também cura qualquer doença. Construir uma pedra-coração leva 30 dias.

Sacola de Almas: Quando um humanoide maligno morre como resultado do Pesadelo Assombrado da bruxa da noite, a bruxa  oleta a alam nesse saco preto feito de pele costurada. Uma sacola de almas pode conter apenas uma alma maligna por vez e apenas a bruxa da noite que construiu a sacola pode coletar uma alma com ela. Construir uma sacola de alma requer 7 dias e um sacrifício humanoide (do qual a pele é usada para fazer a sacola).

Astutas e subversivas, bruxas da noite querem ver a virtuosidade se tornar vilania: amor se torna obsessão, bondade em ódio, devoção em desrespeito e generosidade em egoísmo. As bruxas da noite sentem um prazer perverso em corromper os mortais.
As bruxas da noite certa vez foram criaturas de Faéria, mas sua obscenidade fez com que fossem exiladas para o Hades há muito tempo atrás, onde elas se degeneraram em corruptores. As bruxas da noite, hámuito tempo se  espalharam pelos Planos Inferiores.
Traficante de Almas. Enquanto um humanoide dorme, a bruxa da noite pode ficar sobre a pessoa etereamente e invadir seus sonhos. Qualquer criatura com visão verdadeira pode ver a forma espectral da bruxa sobre sua presa. A bruxa etérea enche a cabeça de sua vítima com dúvidas e temores, na esperança de leva-la a realizar atos malignos no mundo quando despertar. A bruxa continua suas visitas noturnas até a vítima finalmente morrer durante o sono. Se a bruxa levar a vítima a cometer feitos malignos, ela prende a alma corrompida em sua sacola de almas (veja a nota “Itens da Bruxa da Noite”) para transporta-la para o Hades. 

Convenções: Uma bruxa da noite que faça parte de uma convenção (veja a nota “Convenção de Bruxas”) tem um nível de desafio de 7 (2.900 XP).`

acoes:`Garras:

Olhar Mortal:

Aparência Ilusória: 
A bruxa encobre a si mesma e a tudo que ela esteja vestindo ou carregando com uma ilusão mágica que faz com que ela se pareça com uma criatura feia de tamanho similar ao seu e de formato humanoide. O efeito termina se a bruxa usar uma ação bônus para termina-lo ou se ela morrer. 
As mudanças forjadas por esse efeito falham em se manter durante uma inspeção física. Por exemplo, a bruxa pode parecer não possuir garras, mas alguém que toque a mão dela poderá sentir as garras. Do contrário, uma criatura deve realizar uma ação para inspecionar visualmente a ilusão e passar num teste de Inteligência (Investigação) CD 16 para perceber que a bruxa está disfarçada.`,

lore:`As bruxas do mar vivem em covis submersos funestos e poluídos, cercados por merrows e outros monstros aquáticos. A beleza leva a bruxa do mar a ter acessos de raiva. Quando confrontada por algo belo, a bruxa pode simplesmente atacar ou desfigurar a coisa. Se uma coisa bela traz esperanças, a bruxa quer que ela cause desespero. Se ela inspira coragem, a bruxa quer que cause medo.
Feia por Dentro e por Fora. As bruxas do mar são, de longe, as mais feias dentre as bruxas, com escamas viscosas cobrindo sua pele pálida. O cabelo de uma bruxa do mar lembra algas marinhas, cobrindo seu corpo emaciado e seus olhos vítreos parecem tão sem vida quanto os de uma boneca. Apesar da bruxa do mar poder esconder sua forma verdadeira através de um véu de ilusão, a bruxa é amaldiçoada para se parecer feia eternamente. Sua forma ilusória parece desfigurada, na melhor das hipóteses.
Convenções. Uma bruxa do mar que faça parte de uma convenção (veja a nota “Convenção de Bruxas”) tem um nível de desafio de 4 (1.100 XP).`
},

lore:`As miseráveis e odiosas bruxas verdes habitam em florestas moribundas, pântanos solitários e charcos nebulosos, fazendo seus lares em cavernas. As bruxas verdes adoram manipular outras criaturas para que façam suas vontades, mascarando suas intenções atrás de camadas de enganação. Elas atraem suas vítimas para si ao imitar vozes clamando por socorro ou dispersando visitantes desatentos ao imitar o grito de bestas ferozes.
Obcecada por Tragédia: As bruxas verdes deleitamse com as falhas e tragédias de outras criaturas. Elas se alegram ao levar as pessoas ao desânimo e ver esperança se transformar em desespero, e não apenas para os indivíduos, mas também para nações inteiras.

lore:`Os bugbears nasceram para a batalha e mutilação. Sobrevivendo de assaltos e caçadas, eles oprimem os fracos e desprezam ser chefiados, mas o amor deles por carnificina significa que eles irão lutar por mestres poderosos se derramamento de sangue e tesouros forem assegurados.

Seguidores de Hruggek: Os bugbears veneram Hruggek, um deus menor que reside no plano de Aqueronte. Na ausência de seus parentes goblinoides, os bugbears formam bandos dispersos, cada um liderado pelo membro mais brutal. Os bugbears acreditam que quando eles morrem, seus espíritos tem uma chance de lutar ao lado de Hruggek. Eles tentam provar seu valor derrotando o máximo de inimigos possível.
Mercenários Emboscadores: Independentemente de sua compleição intimidante, os bugbears se movem surpreendentemente furtivos. Eles gostam de elaborar emboscadas e fogem quando superados. Eles são mercenários confiáveis, desde que sejam supridos com comida, bebida e tesouros, porém, um bugbears esquece de qualquer vínculo quando sua vida está por um fio. Um membro ferido de um bando de bugbears será deixado para trás para ajudar o resto do bando a escapar. Mais tarde, esse bugbears irá ajudar seus perseguidores a rastrear seus antigos companheiros se fazer isso salvar sua vida.`

acoes:`Mordida:
Ataque Corpo-a-Corpo com Arma: +7 para atingir, alcance 1,5 m, um alvo. Acerto: 30 (4d12 + 4) de dano perfurante. 

Salto Mortal:
Se o bulette pular pelo menos 4,5 metros como parte do seu movimento, ele pode então, usar sua ação para aterrissar em pé num espaço contendo uma ou mais criaturas. Cada uma dessas criaturas deve ser bem sucedida num teste de resistência de Força ou Destreza (à escolha do alvo) CD 16 ou será derrubado no chão e sofrerá 14 (3d6 + 4) de dano de concussão mais 14 (3d6 + 4) de dano cortante. Se obtiver sucesso na resistência, a criatura sofre apenas metade desse dano, não fica caída no chão e é empurrada 1,5 metro para longe do espaço do bulette para um espaço desocupado à escolha da criatura. Se não houver nenhum espaço desocupado ao alcance, a criatura, ao invés, fica caída no espaço do bulette.
`,

lore:`Um bulette é um predador robusto que aterroriza quaisquer locais que ele habitar. Também chamado de “tubarão terrestre”, ele vive apenas para comer. Irascíveis e vorazes, bulettes não temem nenhuma outra criatura e eles  atacam sem receio de superioridade numérica ou força.
Caçadores Subterrâneos: Os bulettes usam suas poderosas garras para criar túneis na terra quando eles caçam. Ignorando obstruções, eles arrancam árvores, causam deslizamentos de terra em encostas soltas e deixam buracos para trás. Quando as vibrações no solo e pedras alertam um bulette de movimentação, ele emerge da superfície, com suas mandíbulas bem abertas ao atacar.
Monstro Errante: Um bulette vagueia por terras temperadas, se alimentando de quaisquer animais e humanoides que encontrar pelo caminho. Essas criaturas tem aversão a carne anã e élfica, apesar de eles geralmente matarem-nos antes de perceberem o que eles são. Um bulette adora a carne de halfling mais que todas e não pode ficar mais feliz do que quando persegue halflings gorduchos por todo um campo aberto.
Um bulette não possui covil, mas perambula por um território de caça de até quarenta e cinco quilômetros de extensão. Seu único critério para o território é a disponibilidade de comida e, quando tiver comido tudo na área, um bulette segue adiante. Essas criaturas muitas vezes se instalam em assentamentos humanoides, aterrorizando-os até que seus residentes fujam em pânicoou até o bulette ser morto.
Todas as criaturas evitam os bulettes, que considera qualquer coisa que se mova como comida – até mesmo outros predadores e bulettes. Os bulettes se juntam apenas para acasalar, resultando num sanguinário ato de garras e dentes que, geralmente termina com a morte e consumo do macho.
Criação Arcana: Alguns sábios acreditam que o bulette é resultado de experimentos de um mago louco no cruzamento de tartarugas e tatus com infusões de pus de demônio. Acreditava-se que os bulettes haviam sido extintos diferentes vezes, mas após anos sem ser avistado, a criatura inevitavelmente reaparece. Devido a seus filhotes nunca serem vistos, alguns sábios suspeitam que os bulettes mantem ninhos secretos enterrados dos quais os adultos emergem para o mundo.`
},

habilidades:`Anfíbio:

Camuflagem Pantanosa:

Falar com Sapos e Rãs:
O bullywug pode comunicar conceitos simples para sapos e rãs quando ele fala Bullywug. Salto Parado. O salto em distância do bullywug é de até 6 metros e seu salto em altura é de até 3 metros, com ou sem uma corrida inicial.`,

acoes:`Ataques Múltiplos:
O bullywug realiza dois ataques: um com sua mordida e um com sua lança. 

Mordida:
Ataque Corpo-a-Corpo com Arma: +3 para atingir, alcance 1,5 m, um alvo. Acerto: 3 (1d4 + 1) de dano de concussão.

Lança:
Ataque Corpo-a-Corpo ou à Distância com Arma: +3 para atingir, alcance 1,5 m ou distância 6/18 m, um alvo. Acerto: 4 (1d6 + 1) de dano perfurante ou 5 (1d8 + 1) de dano perfurante se usada com as duas mãos para realizar um ataque corpo-a-corpo.`,

lore:`A vida como um bullywug é desagradável, brutal e molhada. Esses humanoides anfíbios com cabeça de sapo devem ficar constantemente úmidos, habitando florestas chuvosas, brejos e cavernas úmidas. Sempre famintos e completamente malignos, bullywugs subjugam oponentes com superioridade numérica quando podem, mas eles fogem de ameaças sérias em busca de presas mais fáceis. Os bullywugs tem pele verde, cinza ou mosqueada de amarelo que varia entre tons de cinza, verde e marrom, permitindo que eles se mesclem com seus arredores. Eles vestem armaduras rudes e empunham armas simples e podem desferir uma poderosa mordida nos inimigos que se aproximarem demais.
Aristocracia Corrupta: Bullywugs consideram-se os governantes por direito dos pântanos. Eles seguem um tipo de etiqueta quando lidam com forasteiros e uns com os outros, sujeitos aos caprichos e desejos de seu líder – um autodenominado senhor do estrume. Os bullywug apresentam-se com títulos de sonoridade grandiosa, fazendo grandes apresentações ao se curvar e bajular ante seus superiores e competem interminavelmente para ganhar as graças de seus superiores. 
Um bullywug tem duas maneiras de avançar entre os de sua espécie. Ele pode tanto matar seus rivais, mas deve tomar cuidado para manter seus atos criminosos em segredo, quanto pode encontrar um tesouro ou item mágico e apresenta-lo como tributo ou sinal de reverência ao seu suserano. Um bullywug que assassinar seus rivais sem cautela provavelmente será executado, por isso é mais comum para os bullywug realizarem assaltos contra caravanas e assentamentos, com o objetivo de adquirir bugigangas preciosas para impressionar seus senhores e cair nas suas graças. Invariavelmente, essas mercadorias finas são reduzidas a entulhos imundos através de abuso e negligência. Quando um presente perde seu brilho, um senhor bullywug, invariavelmente, exige que seus súditos tragam mais tesouros em sua homenagem.
Diplomacia Rebelde: Bullywugs adoram ordenar aqueles que invadem seus territórios mais que tudo. Seus guerreiros tentam capturar os intrusos ao invés de simplesmente matá-los.
Os cativos são arrastados perante o rei ou rainha – um bullywug de tamanho excepcionalmente grande – e forçados a suplicar por misericórdia. Subornos, tesouros e bajulação podem iludir o governante bullywug a deixar os cativos partirem, mas não antes de tentar impressionar seus “convidados” com a majestade de seus tesouros e reino. Acometidos por um profundo complexo de inferioridade, senhores bullywug se imaginam como reis e rainhas mas, anseiam desesperadamente pelo medo e respeito dos forasteiros.
Aliados Anfíbios: Os bullywugs falam um idioma que permite que eles se comuniquem por extensas áreas ao coaxarem como sapos. Notícias sobre intrusos ou outros eventos no pântano se espalham em minutos através desse sistema de comunicação rude.
Conceitos simples do idioma são compreendidos por sapos e rãs. Bullywugs usam essa capacidade para formar fortes elos com sapos gigantes, os quais eles treinam como guardiões e caçadores. Espécimes maiores às vezes são usadas como montaria também. A habilidade dos sapos de engolir criaturas inteiras concede ao bando de caça bullywug uma maneira fácil de levar suas presas de volta para suas vilas.`

},

Pancada: Ataque Corpo-a-Corpo com Arma: +6 para atingir, alcance 1,5 m, um alvo. Acerto: 10 (2d6 + 3) de dano de concussão.`,

lore:`Um caçador invisível é um elemental do ar que foi invocado do seu plano de origem e transformado através de magia poderosa. Seu único propósito é caçar criaturas e recuperar objetos para seu invocador. Quando ele é derrotado ou a magia que o prende expira, um caçador invisível desaparece em uma lufada de vento. 
Caçador Direcionado: Quando um caçador invisível é criado, ele permanece do lado do seu invocador até que lhe seja dada uma tarefa para realizar. Caso a atribuição não envolva caçar ou matar uma criatura específica ou recuperar um objeto, a magia que criou o caçador invisível termina e o elemental é libertado. Do contrário, ele completa a tarefa, então retornando para o seu invocador para mais comandos, obrigado a servir até a magia que o prende expirar. Se seu invocador morrer nesse período, o caçador invisível desaparece depois de completar a tarefa. Um caçador invisível, na melhor das hipóteses, é um servo disposto. Ele se ressente de qualquer obrigação que lhe é atribuída. Uma missão que requeira um tempo significativo pode levar o caçador invisível a perverter a intenção do comando a menos que esse seja redigido cuidadosamente.
Ameaça Oculta: Os caçadores invisíveis são compostos de ar e são naturalmente invisíveis. Uma criatura pode ouvir e sentir um caçador invisível passando, mas o elemental permanece invisível até mesmo ao atacar. Uma magia que permita alguém ver o invisível revela apenas o vago contorno do caçador invisível.
Natureza Elemental: Um caçador invisível não precisa respirar, comer, beber ou dormir.`

Conjuração Inata:
A habilidade de conjuração de um cambion é Carisma (CD de resistência de magia 14). Ele pode conjurar, inatamente, as seguintes magias, sem necessidade de componentes materiais:
3/dia cada: alterar-se, comando, detectar magia
1/dia: viagem planar (pessoal apenas)`,

acoes:`Ataques Múltiplos:
O cambion realiza dois ataques corpo-acorpo ou usa seu Raio de Fogo duas vezes.

Lança:
Ataque Corpo-a-Corpo com Arma: +7 para atingir, alcance 1,5 m ou distância 6 m/18 m, um alvo. Acerto: 7 (1d6 + 4) de dano perfurante ou 8 (1d8 + 4) de dano perfurante se usado com duas mãos para realizar um ataque corpo-a-corpo, mais 3 (1d6) de dano de fogo.

Raio de Fogo:
Ataque à Distância com Magia: +7 para atingir, distância 36 m, um alvo. Acerto: 10 (3d6) de dano de fogo.

Charme Demoníaco:
Um humanoide que o cambion possa ver, a até 9 metros, deve ser bem sucedido num teste de resistência de Sabedoria CD 14 ou ficará magicamente enfeitiçado por 1 dia. O alvo enfeitiçado obedece aos comandos falados pelo cambion. Se o alvo sofrer qualquer ferimento do cambion ou de outra criatura ou se receber um comando suicida do cambion, o alvo pode repetir o teste de resistência, terminando o efeito se obtiver sucesso. Se o teste de resistência do alvo for bem sucedido, ou se o efeito terminar nele, a criatura fica imune ao Charme Demoníaco do cambion pelas próximas 24 horas.`,

lore:`Um cambion é o descendente de um corruptor (geralmente uma súcubo ou incubo) e de um humanoide (geralmente um humano). Os cambions herdam aspectos de ambos os pais, mas seus chifres, asas de couro e caudas grossas são características de seu parentesco extraplanar.
Nascido para ser Mau: Cambions tornamse adultos desumanos cuja crueldade e perversão horroriza até o mais devotado pai mortal. Mesmo na juventude, um cambion identifica seu lugar de direito como um soberano entre os mortais. Ele pode orquestrar ataques a cidades e vilas, reunindo bandos de humanoides e diabos menores para servi-lo.
Peões dos Poderosos: Um cambion obrigado a servir seu pai demoníaco o faz por admiração ou por temor, mas também com a expectativa de que um dia irá ascender a um lugar de destaque. Os cambions que cresceram nos Nove Infernos servem como soldados, emissários e servos pessoais para diabos maiores. No Abismo, um cambion possui apenas a autoridade que ele conseguiu reunir por puro poder e força de vontade.
Prole de Graz’zt: O senhor demônio Graz’zt adora procriar com humanoides que fizeram pactos com demônios e ele é pai de muitos cambions que ajudaram-no a semear o caos em todo multiverso. Esses cambions são caracterizados por uma pele negra como carvão, cascos fendidos, mãos com seis dedos e uma beleza sobrenatural.`
},

lore:`Corruptores monstruosos cuspidores de fogo que tomaram a forma de cachorros, cães infernais são encontrados nos campos de batalha de Aqueronte e por todos os Planos Inferiores. No Plano Material, os cães infernais são vistos com mais frequência a serviço de diabos, gigantes do fogo e outras criaturas malignas que os utilizam como animais de guarda e companheiros. 
Fome Abrasadora: Cães infernais caçam em matilhas, alimentando-se de qualquer criatura que pareça comestível. Eles evitam oponentes potencialmente perigosos preferindo se focar em presas mais fracas com suas mordidas ferozes e hálito flamejante, demonstrando uma determinação incansável enquanto perseguem sua presa até seu amargo fim.
Quando os cães infernais se alimentam, a carne que eles consomem alimenta o fogo infernal que queima dentro deles. Quando um cão infernal morre, o fogo consome os restos da criatura em uma erupção de fumaça esvoaçante e de brasas ardentes, não deixando nada para trás além de tufos chamuscados de pelo negro.
Maligno ao Extremo: Cães infernais são mais espertos que as bestas mundanas e sua natureza leal torna-os ótimos para seguir ordens. No entanto, a disposição ao mal de um cão infernal significa que a criatura não pode ser treinada para mais nada além de um assassino implacável. Se um cão infernal não tiver permissão de praticar sua fome malévola, ele rapidamente abandona ou volta-se contra seu mestre.`

lore:`Carniçais vagam pela noite em bandos, conduzidos por uma fome insaciável por carne humanoide.
Devoradores de Carne: Como vermes ou besouros de carniça, carniçais se desenvolvem em locais conhecidos pela decadência e morte. Um carniçal assombra qualquer lugar onde ele possa engolir carne e órgãos em decomposição. Quando ele não pode se alimentar dos mortos, ele persegue criaturas vivas e tenta torna-las cadáveres. Embora eles não recebam qualquer nutrição dos cadáveres que eles devoram, os carniçais são impulsionados por uma fome interminável que os compele a consumir. A carne morta-viva de um carniçal nunca apodrece e esse monstro pode permanecer em uma cripta ou tumba por incontáveis eras sem se alimentar.
Origens Abissais: Carniçais registram suas origens do Abismo. Doresain, o primeiro da espécie, foi um elfo adorador de Orcus. Voltando-se contra seu próprio povo, ele fez um banquete de carne humanoide em honra ao Príncipe Demônio da Morte-Vida. Como recompensa por seu serviço, Orcus transformou Doresain no primeiro carniçal. Dorisain serviu Orcus fielmente no Abismo, criando carniçais a partir dos outros servos do senhor demoníaco até uma incursão de Yeenoghu, o Senhor Gnoll demoníaco, rapitar Doresain do seu domínio abissal. Quando Orcus não interveio em nome dele, Doresain rogou aos deuses élficos por salvação e eles tiveram pena dele e o ajudaram a escapar da destruição certa. Desde então, os elfos se tornaram imunes ao toque paralisante dos carniçais.
Lívidos: Orcus, às vezes, infunde um carniçal com uma forte dose de energia abissal, tornando-os lívidos. Ao passo que carniçais não são mais que bestas selvagens, um lívido é esperto e pode inspirar um bando de carniçais a seguir seus comandos.`

habilidades:`Conjuração:

Marechal Morto-vivo: A não ser que o cavaleiro esteja incapacitado, ele e as criaturas mortas-vivas à sua escolha a até 9 metros dele tem vantagem em testes de resistência contra características que expulsem mortos-vivos.

Resistência à Magia:

acoes: `Ataques Múltiplos:
O cavaleiro realiza três ataques com espada longa.

Espada Longa: Ataque Corpo-a-Corpo com Arma: +11 para atingir, alcance 1,5 m, um alvo. Acerto: 9 (1d8 + 5) de dano cortante ou 10 (1d10 + 5) de dano cortante se usada com as duas mãos, mais 18 (4d8) de dano necrótico.

Orbe de Fogo Infernal (1/Dia):
O cavaleiro arremessa uma bola de fogo mágico que explode num ponto que ele possa ver, a até 36 metros dele. Cada criatura numa esfera de 6 metros, centrada no ponto, deve realizar um teste de resistência de Destreza. A esfera se espalha, dobrando esquinas. Uma criatura sofre 35 (10d6) de dano de fogo e 35 (10d6) de dano necrótico se falhar na resistência, ou metade desse dano se obtiver sucesso.

REAÇÕES:
Aparar:

lore: `buscar redenção, os poderes das trevas podem transformar o que foi certa vez um cavaleiro mortal em uma detestável criatura morta-viva. Um cavaleiro da morte é um guerreiro esquelético vestido em uma armadura de placas assustadora. Embaixo do seu elmo, pode-se ver a caveira do cavaleiro com pontos luminosos malévolos queimando em suas órbitas.
Poder Místico: O cavaleiro da morte mantem a habilidade de conjurar magias divinas. No entanto, nenhum cavaleiro da morte pode usar sua magia para curar. Um cavaleiro da morte também atrai e comando mortos-vivos inferiores, embora cavaleiros da morte que sirvam corruptores poderosos possam ter seguidores corruptores no lugar. Cavaleiros da morte geralmente utilizam cavalos esqueletos e pesadelos como montarias. 
Imortal até ser Redimido: Um cavaleiro da morte pode se reerguer novamente, mesmo após ter sido destruído. Apenas quando ele se reparar por uma vida de maldade ou encontrar a redenção poderá finalmente escapar do seu purgatório de morte-vida e, finalmente, perecer.
Natureza Morta-Viva: Uma cavaleiro da morte não precisa respirar, comer, beber ou dormir.`

Rejuvenescimento:
Se a caveira flamejante for destruída, ela recupera todos os seus pontos de vida em 1 hora, a não ser que água benta seja aspergida sobre seus restos ou a magia dissipar magia ou remover maldição seja conjurada nela.`,

acoes: `Ataques Múltiplos:

Raio de Fogo:
Ataque à Distância com Magia: +5 para atingir, distância 9 m, um alvo. Acerto: 10 (3d6) de dano de fogo.`,

lore: `Chamas esverdeadas e loucura ardem, ecoando segue uma gargalhada vinda de um crânio sem corpo enquanto ele patrulha seus domínios. Quando a caveira flamejante morta-viva encontra invasores, ela explode os intrusos com raios cauterizantes dos seus olhos e magias terríveis convocadas dos recessos sombrios de sua memória. Conjuradores das trevas criaram as caveiras flamejantes a partir dos restos mortais de magos. Quando o ritual é completado, chamas verdes emergem da caveira para completar sua medonha transformação.
Legado de Vida: Uma caveira flamejante lembra-se vagamente de sua vida anterior. Apesar de ela poder falar com sua antiga voz e poder relembrar dos principais eventos do seu passado, ela não passa de um eco do seu eu anterior. No entanto, sua transformação em mortovivo garante a ela acesso total à magia que ela portava em vida, permitindo que ela conjure magias enquanto ignora os componentes materiais e somáticos que ela não pode mais realizar.
Eternamente Limitada: Inteligente e vigilante, uma caveira flamejante serve seu criador protegendo o local de um tesouro escondido, uma câmara secreta ou um indivíduo especifico. Uma caveira flamejante mantem as diretivas dadas quando é criada e ela interpreta esses comando ao pé da letra. Um mestre de uma caveira flamejante deve formar suas instruções com cuidado para garantir que a criatura realize suas tarefas apropriadamente.
Mortalha de Chamas: O fogo que envolve a caveira flamejante queima continuamente, concedendo a luz plena que a criatura controla. Ela usa essas chamas como arma, focando-a para disparar raios ardentes de suas órbitas oculares.
Rejuvenescimento Místico: Os fragmentos de uma caveira flamejante se juntam a não ser que eles sejam salpicados com água benta ou alvos da magia dissipar magia ou remover maldição. Se ela não puder mais atender aos seus propósitos, a caveira flamejante reformada não tem obrigação com mais ninguém e tornase autônoma.
Natureza Morta-Viva. Uma caveira flamejante não precisa respirar, comer, beber ou dormir.`

acoes: `Ataques Múltiplos:
O centauro realiza dois ataques: um com sua lança montada e outro com seus cascos ou dois com o arco longo. 

Lança Montada: Ataque Corpo-a-Corpo com Arma: +6 para atingir, alcance 3 m, um alvo. Acerto: 9 (1d10 + 4) de dano perfurante.

Cascos:
Ataque Corpo-a-Corpo com Arma: +6 para atingir, alcance 1,5 m, um alvo. Acerto: 11 (2d6 + 4) de dano de concussão.

Arco Longo: Ataque à Distância com Arma: +4 para atingir, distância 45/180 m, um alvo. Acerto: 6 (1d8 + 2) de dano perfurante.`,

lore:`Andarilhos reclusos e leitores de presságios do ambiente selvagem, centauros evitam conflitos, mas lutam ferozmente quando pressionados. Eles vagam pela vastidão selvagem, mantendo-se distantes das fronteiras, leis e da companhia de outras criaturas.
Nômades da Vastidão Selvagem: Tribos de centauros espalharam-se por terras de climas leves até quentes, onde o centauro precisa apenas de pelagens leves ou peles oleosas para lidar com as intempéries. Eles são caçadores- coletores e raramente constroem abrigos ou se quer usam tendas.
Migrações de centauros alcançam continentes e levam décadas para se repetir, por isso que uma tribo de centauros pode não voltar pelo mesmo caminho por gerações. Esses padrões variados pode levar a conflitos quando centauros encontram assentamentos de outras criaturas ao longo de suas rotas tradicionais.
Colonos Relutantes: Um centauro que não consiga manter o ritmo com o resto de sua tribo é deixado para trás. Centauros como estes desparecem na vastidão selvagem e nunca mais são vistos novamente. Aqueles que conseguem se virar com a perda da sua tribo instalam residência entre outras raças. Assentamentos em fronteiras valorizam o conhecimento natural dos centauros residentes. Muitas comunidades dessas devem sua sobrevivência à intuição e presciência de um centauro. 
Independentemente de sua natureza reclusa, centauros negociam com elfos e com caravanas de outros humanoides benevolentes que eles encontram durante suas andanças. Um comerciante poderia salvar a vida de um centauro ferido ou velho demais para realizar longas viagens, escoltando-o para um assentamento onde ele possa viver pacificamente pelo resto dos seus dias.`

},

Sentir Magia:
O chuul sente magia a até 36 metros dele, à vontade. Esse traço, no mais, funciona como a magia detectar magia, mas não é mágico por si próprio.`,

acoes:`Ataques Múltiplos:
O chuul realiza dois ataques de pinça. Se o chuul estiver agarrando uma criatura, ele também pode usar seus tentáculos uma vez. 

Pinças:
Ataque Corpo-a-Corpo com Arma: +6 para atingir, alcance 3 m, um alvo. Acerto: 11 (2d6 + 4) de dano de concussão. O alvo fica agarrado (CD 14 para escapar) se for uma criatura Grande ou menor e o chuul não tenha duas outras criaturas agarradas.

Tentáculos:
Uma criatura agarrada pelo chuul deve ser bem sucedida num teste de resistência de Constituição CD 13 ou ficará envenenada por 1 minuto. Até esse veneno acabar, o alvo fica paralisado. O alvo pode repetir o teste de resistência ao final de cada um dos seus turnos, terminando o efeito em si caso obtenha sucesso.`,

lore:`Sobreviventes do antigo império abolete, chuuls são crustáceos que os aboletes modificaram e dotaram com senciência. Eles seguem as diretivas arraigadas dos seus criadores, como eles tem feito desde a aurora dos tempos.
Lembranças Primitivas. Nas eras primitivas, aboletes governavam um vasto império espalhado pelos oceanos do mundo. Nesses dias, os aboletes usaram magia poderosa e dobraram as mentes das criaturas nascentes do reino mortal. No entanto, eles estavam presos a água e não podiam exercer sua vontade além dela sem servos. Por esse motivo, eles criaram os chuul.
Perfeitamente obedientes, os chuul capturam criaturas racionais e magias ao comando dos aboletes. Os chuul foram feitos para durar pelas eras do mundo, aumentando de tamanho e força à medida que o tempo passa. Quando o império abolete ruiu com a ascensão dos deuses, os chuuls ficaram à deriva. No entanto, essas criaturas continua a fazer o que faziam para os aboletes, lentamente capturando humanoides, coletando tesouros, acumulando magias e consolidando poder.
Guardiões Incansáveis. Um chuul continua guardando as ruínas do antigo império abolete. Eles se mantem em silêncio cumprindo os comandos de eras passadas. Rumores e mapas antigos às vezes trazem caçadores de tesouro para essas ruínas, mas a recompensa por sua ousadia é a morte.
Sejam quais forem as riquezas trazidas pelos exploradores consigo, contribui para o tesouro guardado pelos chuuls. Os chuuls podem sentir magia à distância. Esse sentido se junta com o impulso inato que os leva a matar exploradores, tomar seus pertences e enterra-los em locais secretos ordenados pelos aboletes eras atrás. 
Servos em Espera. Apesar do império abolete ancestral ter sucumbido há muitas eras, os elos psíquicos entre eles e seus servos criados permanecem intactos. Os chuuls que entram em contato com aboletes imediatamente assumem seus antigos papeis. Tais chuuls direcionam sua compulsão por servir aos sinistros propósitos do abolete.`
},
